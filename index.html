<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホで勝手に拡大・縮小されないようにする -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ワンオペわんこ亭</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ゲーム領域（1280×720 で作り、main.js でウィンドウに合わせて拡大縮小する） -->
  <!-- 各画面の中身は scenes.js（プレイ画面は view.js）が作る -->
  <div id="stage">
    <div id="scene-title" class="scene"></div>   <!-- タイトル -->
    <div id="scene-select" class="scene"></div>  <!-- 難易度選択 -->
    <div id="scene-intro" class="scene"></div>   <!-- 導入（先輩からの連絡） -->
    <div id="scene-play" class="scene"></div>    <!-- プレイ -->
    <div id="scene-result" class="scene"></div>  <!-- 結果 -->
  </div>

  <!-- スマホを縦向きにしているときのお知らせ -->
  <div id="rotate-notice">
    <div>📱↻</div>
    <div>スマホを横向きにして遊んでね</div>
  </div>

  <!-- 読み込む順番が大事：設定 → 小道具 → 本体 → 起動 -->
  <script src="js/config.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/view.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
