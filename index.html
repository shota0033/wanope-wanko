<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホで勝手に拡大・縮小されないようにする -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>わんオペわんこ亭</title>

  <!-- ホーム画面に追加したとき、アプリのように全画面で起動するための設定 -->
  <link rel="manifest" href="manifest.webmanifest">           <!-- Android など -->
  <meta name="apple-mobile-web-app-capable" content="yes">    <!-- iPhone：アドレスバーなしで起動 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="わんこ亭"> <!-- ホーム画面に出る名前 -->
  <meta name="theme-color" content="#7a4a2a">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"> <!-- iPhoneのホーム画面のアイコン -->

  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <!-- ゲーム領域（1280×720 で作り、main.js でウィンドウに合わせて拡大縮小する） -->
  <!-- 各画面の中身は scenes.js（プレイ画面は view.js）が作る -->
  <div id="stage">
    <div id="scene-title" class="scene"></div>   <!-- タイトル（レベル選択） -->
    <div id="scene-intro" class="scene"></div>   <!-- 導入（先輩からの連絡） -->
    <div id="scene-play" class="scene"></div>    <!-- プレイ -->
    <div id="scene-result" class="scene"></div>  <!-- 結果 -->
  </div>

  <!-- スマホを縦向きにしているときのお知らせ -->
  <div id="rotate-notice">
    <div>📱↻</div>
    <div>スマホを横向きにして遊んでね</div>
  </div>

  <!-- 読み込む順番が大事：設定 → 小道具 → 本体 → 起動 -->
  <script src="js/config.js?v=6"></script>
  <script src="js/assets.js?v=6"></script>
  <script src="js/sound.js?v=6"></script>
  <script src="js/storage.js?v=6"></script>
  <script src="js/input.js?v=6"></script>
  <script src="js/game.js?v=6"></script>
  <script src="js/view.js?v=6"></script>
  <script src="js/scenes.js?v=6"></script>
  <script src="js/main.js?v=6"></script>
</body>
</html>
